<header class="barra">
  <a class="marca" routerLink="/publicaciones">
    <img class="marca__escudo" src="/escudo.png" alt="" />
    <span>Racingram</span>
  </a>

  <nav class="enlaces">
    <a routerLink="/publicaciones" routerLinkActive="activo">Publicaciones</a>
    <a routerLink="/mi-perfil" routerLinkActive="activo">Mi perfil</a>
    <a *appSoloAdministrador routerLink="/dashboard" routerLinkActive="activo">Administración</a>
  </nav>

  <div class="sesion">
    <span class="nombre">{{ auth.usuario()?.usuario }}</span>
    <button matButton="filled" type="button" (click)="salir()">Salir</button>
  </div>
</header>
